<div class="container my-5">
  <h2 class="mb-4 text-center text-secondary">Our Top Brands</h2>
  <hr>
 @if (brands.length > 0) {
    <div class="row row-cols-2 row-cols-md-4 row-cols-lg-6 g-4">
      @for (brand of brands; track $index) {
        <div class="col">
          <div class="card h-100 shadow-sm border brand-card p-3 text-center">
             <a
              [routerLink]="['/brand', brand._id]">
                <img [src]="brand.image" class="card-img-top brand-img" [alt]="brand.name">
                <div class="card-body p-2">
                    <p class="card-text text-muted small fw-medium">{{ brand.name }}</p>
                </div>
            </a>
          </div>
        </div>
      }
    </div>
  }

  @else {
    <div class="alert alert-info text-center">No brands found.</div>
  }
</div>
