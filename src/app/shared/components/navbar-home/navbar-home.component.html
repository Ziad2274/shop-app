<!-- Navbar -->
<nav class="navbar navbar-expand-lg bg-white py-3 shadow-sm">
  <div class="container-fluid">
    <!-- Logo -->
    <a class="navbar-brand fw-bold fs-4 text-dark ms-3 me-5" routerLink="home">
      ZIZO SHOP
    </a>

    <!-- Toggle Button (mobile) -->
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Navbar Content -->
    <div class="collapse navbar-collapse" id="navbarNav">
      <!-- Centered Nav Links -->
      <ul class="navbar-nav mx-auto text-center">
        <li class="nav-item pe-3">
          <a class="nav-link bolder" routerLink="home">Home</a>
        </li>
        <li class="nav-item pe-3">
          <a class="nav-link" routerLink="product" routerLinkActive="active-link text-dark">Products</a>
        </li>
        <li class="nav-item pe-3">
          <a class="nav-link" routerLink="cart" routerLinkActive="active-link text-dark">Cart</a>
        </li>
      </ul>

      <!-- Search Bar -->
      <div class="d-flex align-items-center justify-content-center me-lg-3 mb-3 mb-lg-0">
        <div class="position-relative">
          <input
            [(ngModel)]="searchedWord"
            (ngModelChange)="onSearchChange()"
            class="form-control rounded-pill ps-5"
            type="search"
            placeholder="Search for products..."
            style="width: 300px"
          />
          <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-3 text-secondary"></i>
        </div>
      </div>

      <!-- Icons (Right for desktop, center for mobile) -->
      <div class="d-flex align-items-center justify-content-center mt-3 mt-lg-0">
        <button routerLink="/cart" class="bg-transparent border-0 me-3 position-relative">
          <mat-icon class="fs-4 text-dark" >shopping_cart</mat-icon>
          <span
            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
            style="font-size: 0.7rem"
            >{{cartItemsCount}}</span>
        </button>
        <button class="bg-transparent border-0">
          <mat-icon [matMenuTriggerFor]="accountMenu" class="fs-4 text-dark">account_circle</mat-icon>
        </button>
      </div>
    </div>
  </div>
</nav>
  <mat-menu #accountMenu="matMenu">

        <div class="p-3 text-center border-bottom" style="min-width: 250px;">
            <p class="mb-1 fw-bold">{{ userName}}</p>
            <p class="text-muted small">{{userEmail }}</p>
            <a mat-button color="primary" routerLink="/profile" class="mt-2 text-decoration-none">
                View Profile
            </a>
        </div>

        <button mat-menu-item routerLink="/allorders">
            <mat-icon>shopping_cart</mat-icon>
            <span>My Orders</span>
        </button>

        <button mat-menu-item routerLink="/wishlist">
            <mat-icon>favorite</mat-icon>
            <span>Wishlist</span>
        </button>

        <button mat-menu-item routerLink="/change-password">
            <mat-icon>lock_reset</mat-icon>
            <span>Change Password</span>
        </button>

        <button mat-menu-item routerLink="/addresses">
            <mat-icon>location_on</mat-icon>
            <span>Addresses</span>
        </button>

        <button mat-menu-item (click)="signOut()">
            <mat-icon>logout</mat-icon>
            <span>Sign Out</span>
        </button>

</mat-menu>
