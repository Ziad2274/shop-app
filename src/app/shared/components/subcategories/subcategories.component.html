<div class="container my-5">
  <div class="text-center mb-5">
    <h1 class="fw-bold text-dark">Explore Our Subcategories</h1>
    <p class="text-muted">Find the products you’re looking for, organized by category</p>
  </div>

  <!-- Loading -->
  <div *ngIf="!isLoaded" class="d-flex justify-content-center py-5">
    <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <!-- Empty -->
  <div *ngIf="isLoaded && subcategories.length === 0" class="alert alert-info text-center py-4 rounded-3 shadow-sm">
    <h4 class="mb-1">No Subcategories Found 😔</h4>
    <p class="text-muted mb-0">Please check back later or choose a different category.</p>
  </div>

  <!-- Grid -->
  <div *ngIf="subcategories.length > 0" class="row g-4">
    <div class="col-12 col-sm-6 col-md-4 col-lg-3" *ngFor="let sub of subcategories">
      <div class="card border-0 shadow-sm h-100 sub-card hover-shadow transition">
        <div class="card-body text-center">
          <div class="icon-wrapper bg-primary bg-opacity-10 text-primary mb-3 rounded-circle d-inline-flex align-items-center justify-content-center" style="width: 60px; height: 60px;">
            <i class="bi bi-tags-fill fs-4"></i>
          </div>
          <h5 class="card-title fw-bold text-dark mb-2">{{ sub.name }}</h5>
          <p class="card-text text-muted small">{{ sub.category?.name || 'General' }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
