<div class="container py-5" style="max-width: 600px;">
  <h3 class="fw-bold mb-4">My Addresses</h3>

  @if (loading) {
    <div class="d-flex justify-content-center py-3">
      <div class="spinner-border text-dark" role="status"></div>
    </div>
  } @else if (addresses.length === 0) {
    <p class="text-muted">You haven't saved any addresses yet.</p>
  } @else {
    <div class="mb-4">
      @for (address of addresses; track address._id) {
        <div class="card shadow-sm border-0 rounded-3 mb-3 p-3 d-flex flex-row justify-content-between align-items-center">
          <div>
            <p class="mb-0 fw-semibold">{{ address.street }}</p>
            <p class="mb-0 text-muted small">{{ address.city }}, {{ address.zipCode }}</p>
          </div>
          <button class="btn btn-outline-danger btn-sm" (click)="deleteAddress(address._id)">Delete</button>
        </div>
      }
    </div>
  }

  <div class="card shadow-sm border-0 rounded-4 p-4">
    <h5 class="fw-bold mb-3">Add New Address</h5>
    <form [formGroup]="form" (ngSubmit)="addAddress()">
      <div class="mb-3">
        <label class="form-label">City</label>
        <input type="text" class="form-control" formControlName="city" />
      </div>
      <div class="mb-3">
        <label class="form-label">Street</label>
        <input type="text" class="form-control" formControlName="street" />
      </div>
      <div class="mb-3">
        <label class="form-label">Zip Code</label>
        <input type="text" class="form-control" formControlName="zipCode" />
      </div>

      @if (errMsg) {
        <div class="alert alert-danger py-2">{{ errMsg }}</div>
      }

      <button type="submit" class="btn btn-dark w-100" [disabled]="submitting">
        @if (submitting) {
          <span class="spinner-border spinner-border-sm me-2"></span>
        }
        Add Address
      </button>
    </form>
  </div>
</div>
